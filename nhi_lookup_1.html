<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健保醫令代碼查詢系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0a0e17;
  --surface: #131927;
  --surface2: #1a2235;
  --border: #243049;
  --text: #e8ecf4;
  --text2: #8b95a8;
  --accent: #00d4aa;
  --accent2: #00b894;
  --tag-226: #f39c12;
  --tag-227: #e74c3c;
  --tag-3343: #3498db;
  --tag-mat: #9b59b6;
  --tag-sp: #1abc9c;
}
body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 20px 16px;
}
.header {
  text-align: center;
  padding: 32px 0 24px;
}
.header h1 {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 2px;
  background: linear-gradient(135deg, var(--accent), #00b4d8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header p {
  color: var(--text2);
  font-size: 13px;
  margin-top: 6px;
}
.search-box {
  position: relative;
  margin-bottom: 12px;
}
.search-box input {
  width: 100%;
  padding: 16px 20px 16px 48px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 16px;
  color: var(--text);
  font-size: 16px;
  font-family: 'Noto Sans TC', sans-serif;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.search-box input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 20px rgba(0,212,170,0.15);
}
.search-box input::placeholder { color: #4a5568; }
.search-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text2);
  font-size: 18px;
}
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.tab {
  padding: 8px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text2);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  font-family: 'Noto Sans TC', sans-serif;
}
.tab:hover { border-color: var(--accent); color: var(--text); }
.tab.active {
  background: rgba(0,212,170,0.12);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 500;
}
.tab .count {
  font-size: 11px;
  opacity: 0.6;
  margin-left: 4px;
}
.stats {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.stat {
  padding: 10px 14px;
  background: var(--surface);
  border-radius: 10px;
  flex: 1;
  min-width: 100px;
  text-align: center;
}
.stat .num {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
}
.stat .label {
  font-size: 11px;
  color: var(--text2);
  margin-top: 2px;
}
.results {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.result-count {
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 4px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  transition: border-color 0.2s, transform 0.1s;
  cursor: default;
}
.card:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}
.card-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.code {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  background: rgba(0,212,170,0.1);
  padding: 2px 8px;
  border-radius: 6px;
}
.tag {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 6px;
}
.tag-226 { background: rgba(243,156,18,0.15); color: var(--tag-226); }
.tag-227 { background: rgba(231,76,60,0.15); color: var(--tag-227); }
.tag-3343 { background: rgba(52,152,219,0.15); color: var(--tag-3343); }
.tag-cat { background: rgba(139,149,168,0.15); color: var(--text2); }
.tag-mat { background: rgba(155,89,182,0.15); color: var(--tag-mat); }
.tag-sp { background: rgba(26,188,156,0.15); color: var(--tag-sp); }
.card-name {
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
}
.card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.points {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
}
.points span {
  font-size: 12px;
  font-weight: 400;
  color: var(--text2);
  margin-left: 4px;
}
.price {
  font-size: 14px;
  color: var(--accent);
  font-weight: 500;
}
.point-info {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--text2);
  margin-top: 6px;
}
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text2);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 14px; }
.empty-hint { font-size: 12px; margin-top: 8px; opacity: 0.6; }
.footer {
  text-align: center;
  padding: 24px 0;
  font-size: 11px;
  color: var(--text2);
  opacity: 0.5;
}
@media (max-width: 480px) {
  .container { padding: 12px 10px; }
  .header h1 { font-size: 18px; }
  .stats { gap: 6px; }
  .stat { padding: 8px 10px; min-width: 80px; }
  .stat .num { font-size: 16px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>健保醫令代碼查詢系統</h1>
    <p>支付標準 ╱ 健保特材 ╱ 全自費醫材</p>
  </div>
  <div id="app"></div>
  <div class="footer">資料來源：衛生福利部中央健康保險署 開放資料</div>
</div>

  {id:'227', label:'227 手術', filter: i => i.sec==='227'},
  {id:'226', label:'226 處置', filter: i => i.sec==='226'},
  {id:'3343', label:'3343 牙科', filter: i => i.sec==='3343'},
  {id:'mat', label:'健保特材', filter: null, src:'m'},
  {id:'sp', label:'全自費醫材', filter: null, src:'s'},
];

let currentTab = 'all';
let query = '';

function search(q, tab) {
  q = q.trim().toUpperCase();
  if (!q) return [];
  
  const tabDef = TABS.find(t => t.id === tab);
  let results = [];
  
  if (tab === 'mat') {
    // Search materials
    results = D.m.filter(m => 
      m[0].toUpperCase().includes(q) || m[1].toUpperCase().includes(q)
    ).slice(0, 50).map(m => ({
      type: 'mat', c: m[0], n: m[1], p: m[2]
    }));
  } else if (tab === 'sp') {
    // Search self-pay
    results = D.s.filter(s =>
      s[0].toUpperCase().includes(q) || s[1].toUpperCase().includes(q)
    ).slice(0, 50).map(s => ({
      type: 'sp', c: s[0], n: s[1], p: s[2]
    }));
  } else {
    // Search payment standard
    let items = D.p;
    if (tabDef.filter) {
      items = items.filter(tabDef.filter);
    }
    results = items.filter(i =>
      i.c.toUpperCase().includes(q) || i.n.toUpperCase().includes(q)
    ).slice(0, 50).map(i => ({
      type: 'pstd', ...i
    }));
  }
  
  return results;
}

function getSectionTag(item) {
  if (item.type === 'mat') return '<span class="tag tag-mat">健保特材</span>';
  if (item.type === 'sp') return '<span class="tag tag-sp">全自費</span>';
  if (item.sec === '227') return '<span class="tag tag-227">227 · 手術</span>';
  if (item.sec === '226') return '<span class="tag tag-226">226 · 處置</span>';
  if (item.sec === '3343') return '<span class="tag tag-3343">3343 · 牙科</span>';
  if (item.cat) return '<span class="tag tag-cat">' + item.cat + '</span>';
  return '';
}

function renderCard(item) {
  const pts = item.p || 0;
  const priceHtml = pts > 0 ? 
    '<div class="card-bottom">' +
    '<div class="points">' + pts.toLocaleString() + '<span>點</span></div>' +
    '<div class="price">$ ' + pts.toLocaleString() + '</div>' +
    '</div>' +
    '<div class="point-info">' +
    '<span>診所 0.8 → $' + Math.round(pts * 0.8).toLocaleString() + '</span>' +
    '<span>一般 1.0 → $' + pts.toLocaleString() + '</span>' +
    '<span>醫學中心 1.1 → $' + Math.round(pts * 1.1).toLocaleString() + '</span>' +
    '</div>' : '';
  
  return '<div class="card">' +
    '<div class="card-top">' +
    '<span class="code">' + item.c + '</span>' +
    getSectionTag(item) +
    '</div>' +
    '<div class="card-name">' + item.n + '</div>' +
    priceHtml +
    '</div>';
}

function render() {
  const results = query ? search(query, currentTab) : [];
  
  const tabsHtml = TABS.map(t => {
    let count = '';
    if (t.id === 'mat') count = D.m.length;
    else if (t.id === 'sp') count = D.s.length;
    else if (t.filter) count = D.p.filter(t.filter).length;
    else count = D.p.length;
    
    return '<button class="tab' + (currentTab === t.id ? ' active' : '') + 
           '" data-tab="' + t.id + '">' + t.label + 
           '<span class="count">' + count + '</span></button>';
  }).join('');
  
  let contentHtml = '';
  if (!query) {
    contentHtml = '<div class="stats">' +
      '<div class="stat"><div class="num">' + D.p.filter(i=>i.sec==='227').length + '</div><div class="label">227 手術</div></div>' +
      '<div class="stat"><div class="num">' + D.p.filter(i=>i.sec==='226').length + '</div><div class="label">226 處置</div></div>' +
      '<div class="stat"><div class="num">' + D.p.filter(i=>i.sec==='3343').length + '</div><div class="label">3343 牙科</div></div>' +
      '<div class="stat"><div class="num">' + D.m.length.toLocaleString() + '</div><div class="label">健保特材</div></div>' +
      '</div>' +
      '<div class="empty">' +
      '<div class="empty-icon">🔍</div>' +
      '<div class="empty-text">輸入代碼或關鍵字開始查詢</div>' +
      '<div class="empty-hint">例如：62001C、腫瘤切除、水晶體、人工關節</div>' +
      '</div>';
  } else if (results.length === 0) {
    contentHtml = '<div class="empty">' +
      '<div class="empty-icon">😕</div>' +
      '<div class="empty-text">找不到符合的結果</div>' +
      '<div class="empty-hint">試試其他關鍵字或切換分類</div>' +
      '</div>';
  } else {
    contentHtml = '<div class="result-count">找到 ' + results.length + (results.length >= 50 ? '+' : '') + ' 筆結果</div>' +
      '<div class="results">' + results.map(renderCard).join('') + '</div>';
  }
  
  document.getElementById('app').innerHTML = 
    '<div class="search-box">' +
    '<span class="search-icon">⌕</span>' +
    '<input type="text" id="searchInput" placeholder="輸入代碼或中文關鍵字..." value="' + (query || '') + '">' +
    '</div>' +
    '<div class="tabs">' + tabsHtml + '</div>' +
    contentHtml;
  
  // Bind events
  let composing = false;
  const si = document.getElementById('searchInput');
  si.addEventListener('compositionstart', () => { composing = true; });
  si.addEventListener('compositionend', function(e) {
    composing = false;
    query = e.target.value;
    render();
    const input = document.getElementById('searchInput');
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  });
  si.addEventListener('input', function(e) {
    if (composing) return;
    query = e.target.value;
    render();
    const input = document.getElementById('searchInput');
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  });
  
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', function() {
      currentTab = this.dataset.tab;
      render();
      // Refocus search
      const input = document.getElementById('searchInput');
      if (input) input.focus();
    });
  });
}

render();
</script>
</body>
</html>
